name: Research request
description: Request primary-source research for a curriculum decision
title: "[Research] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Read CONTRIBUTING.md and QUALITY.md first. Research must inform a bounded curriculum decision and preserve source provenance."
  - type: textarea
    id: question
    attributes:
      label: Decision-oriented research question
      description: State the decision this research should inform; avoid an unbounded topic.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Include domain, versions, environments, and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Preferred primary sources
      description: List standards, maintainers, official documentation, source code, papers, or direct measurements. Include versions, dates, and known disagreements.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Required output and acceptance criteria
      description: Define the claim-to-source map, comparison, bounded experiment, reference update, curriculum change, uncertainty record, and review expected.
    validations:
      required: true
  - type: textarea
    id: downstream
    attributes:
      label: Affected curriculum and maintenance
      description: Name lessons, practice, assessments, tracks, overlays, cases, links, diagrams, owners, and future change triggers that may be affected.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data, access, safety, and cost
      description: State whether private data, credentials, paid services, scraping, experiments, or destructive actions are involved and how they remain authorized and bounded.
    validations:
      required: true
  - type: checkboxes
    id: integrity
    attributes:
      label: Source integrity
      options:
        - label: "Claims will be traceable to primary sources; quotations, uncertainty, version dependence, and synthetic evidence will be explicit."
          required: true
