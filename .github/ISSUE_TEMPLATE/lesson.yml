name: Lesson proposal or correction
description: Propose a lesson, deepen an explanation, or report a technical error
title: "[Lesson] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Read CONTRIBUTING.md and QUALITY.md first. Lessons must explain purpose, mechanism, evidence, failure, practice, sources, and one next step."
  - type: input
    id: module
    attributes:
      label: Module and lesson
      placeholder: "01-software-foundations / How Software Actually Executes"
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Change type
      options:
        - Technical correction
        - New lesson proposal
        - Missing depth or mental model
        - Broken reference or navigation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and learner impact
      description: Identify what is incorrect, unclear, missing, or misleading.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and authoritative sources
      description: Map claims to standards, official documentation, maintainer material, primary papers, or reproducible measurements. Include versions and uncertainty. Do not paste copyrighted material.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, prerequisites, and navigation
      description: Name prerequisites, non-goals, version boundaries, canonical location, parent index, and the intended next lesson.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State observable explanation, practice, failure, source, link, and diagram outcomes.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and review
      description: List checks to run, evidence to reproduce, and required domain or specialist reviewers.
    validations:
      required: true
  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity and safety
      options:
        - label: "I will not include secrets, private data, invented evidence, copied course material, or unsupported source claims."
          required: true
