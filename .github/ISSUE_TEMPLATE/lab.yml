name: Lab proposal or correction
description: Propose or improve an evidence-driven build, break, and debug exercise
title: "[Lab] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Read CONTRIBUTING.md and QUALITY.md first. Prefer a disposable local environment and require prediction, evidence, recovery, and cleanup."
  - type: input
    id: lesson
    attributes:
      label: Related lesson
      placeholder: "Relative link or module/lesson name"
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Mental model under test
      description: What behavior should the learner predict and observe?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment, safety, and cost
      description: List versions, tools, identity and target checks, privileges, data, destructive actions, load, duration, charges, stop conditions, rollback, and cleanup proof.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Controlled failure and evidence
      description: Describe the healthy baseline, fault, predicted symptoms, competing hypotheses, discriminating evidence, reversible correction, and sustained recovery proof.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      description: Define observable build, debug, operate, cleanup, and no-notes explain-back proof, including what the lab cannot establish.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources, navigation, and versions
      description: Link authoritative mechanism sources and the canonical lesson, parent index, and next practice. State version boundaries.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Reproduction and review plan
      description: Give the clean-state rerun plan and name the domain, operator, security, or cost review required.
    validations:
      required: true
  - type: checkboxes
    id: safe_fixture
    attributes:
      label: Safe fixture
      options:
        - label: "The exercise uses authorized synthetic data and a disposable or explicitly bounded target."
          required: true
